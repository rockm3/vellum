[workspace]
members = [
    "vellum-pdf",
    "vellum-text",
    "vellum-debug",
    "vellum-render",
    "vellum-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vellum-pdf    = { path = "vellum-pdf" }
vellum-text   = { path = "vellum-text" }
vellum-debug  = { path = "vellum-debug" }
vellum-render = { path = "vellum-render" }
lopdf         = "0.40"
clap          = { version = "4", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
thiserror     = "2"
memmap2       = "0.9"
